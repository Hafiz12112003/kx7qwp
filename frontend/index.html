<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UK Wind Forecast Monitor</title>
    <style>
      body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: #f4f6f9; color: #1c2430; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { margin: 0 0 4px; font-size: 26px; }
      .sub { color: #5a6676; margin: 0 0 20px; }
      .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
      .controls label { display: flex; flex-direction: column; font-size: 13px; color: #5a6676; gap: 4px; }
      .controls input, .controls select { padding: 6px 8px; font-size: 14px; border: 1px solid #c8d0db; border-radius: 6px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .card { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      .card .l { font-size: 12px; color: #5a6676; }
      .card .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
      .card .n { font-size: 12px; color: #8793a3; margin-top: 2px; }
      .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      .panel h2 { margin: 0 0 4px; font-size: 17px; }
      .panel p { margin: 0 0 12px; color: #5a6676; font-size: 13px; }
      .err { background: #fde8e8; color: #9b1c1c; padding: 10px; border-radius: 8px; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
